<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Credit Debit Tracker Pro</title><link rel="manifest" href="manifest.json"><link rel="stylesheet" href="style.css"></head><body><div class="app"><h1>💰 Credit Tracker Pro</h1><div id="dashboard"></div><section><h2>🟢 Money I Receive</h2><input id="receiveName" placeholder="Person Name"><input id="receiveAmount" type="number" placeholder="Amount"><select id="receiveCurrency"><option>QAR</option><option>INR</option></select><button onclick="addReceive()">Add</button></section><section><h2>🔴 Money I Pay</h2><input id="payName" placeholder="Person / Company"><input id="payAmount" type="number" placeholder="Amount"><select id="payCurrency"><option>QAR</option><option>INR</option></select><button onclick="addPay()">Add</button></section><section><h2>💳 Credit Cards</h2><input id="cardName" placeholder="Card Name"><input id="cardAmount" type="number" placeholder="Outstanding"><select id="cardCurrency"><option>QAR</option><option>INR</option></select><button onclick="addCard()">Add Card</button></section><section><h2>⚙️ Backup</h2><button onclick="backupData()">Export Backup</button><input type="file" onchange="restoreData(event)"></section><h2>📋 Records</h2><div id="list"></div></div><script src="script.js"></script><script>if('serviceWorker' in navigator){navigator.serviceWorker.register('service-worker.js')}</script></body></html>
