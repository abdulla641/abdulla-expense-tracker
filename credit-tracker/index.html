<!DOCTYPE html>
<html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Credit Debit Tracker</title><link rel="stylesheet" href="style.css"></head><body><div class="app"><h1>💰 Credit & Debit Tracker</h1><div id="dashboard"></div><section><h2>🟢 Receive Money</h2><input id="receiveName" placeholder="Person Name"><input id="receiveAmount" type="number" placeholder="Amount"><select id="receiveCurrency"><option>QAR</option><option>INR</option></select><button onclick="addReceive()">Add</button></section><section><h2>🔴 Pay Money</h2><input id="payName" placeholder="Person / Company"><input id="payAmount" type="number" placeholder="Amount"><select id="payCurrency"><option>QAR</option><option>INR</option></select><button onclick="addPay()">Add</button></section><section><h2>💳 Credit Card</h2><input id="cardName" placeholder="Card Name"><input id="cardAmount" type="number" placeholder="Outstanding"><select id="cardCurrency"><option>QAR</option><option>INR</option></select><button onclick="addCard()">Add Card</button></section><div id="list"></div></div><script src="script.js"></script></body></html>
