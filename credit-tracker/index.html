<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Credit & Debit Tracker</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">
<h1>💰 Credit & Debit Tracker</h1>
<div id="dashboard"></div>
<section>
<h2>🟢 Money I Will Receive</h2>
<input id="receiveName" placeholder="Name">
<input id="receiveAmount" type="number" placeholder="Amount">
<select id="receiveCurrency"><option>QAR</option><option>INR</option></select>
<button onclick="addReceive()">Add</button>
</section>
<section>
<h2>🔴 Money I Need To Pay</h2>
<input id="payName" placeholder="Name">
<input id="payAmount" type="number" placeholder="Amount">
<select id="payCurrency"><option>QAR</option><option>INR</option></select>
<button onclick="addPay()">Add</button>
</section>
<div id="list"></div>
</div>
<script src="script.js"></script>
</body>
</html>
