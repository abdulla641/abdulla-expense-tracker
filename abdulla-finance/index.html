<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Abdulla Finance</title><link rel="manifest" href="manifest.json"><link rel="stylesheet" href="style.css"></head><body><div class="app"><header><h1>💰 Abdulla Finance</h1><p>Personal Finance Dashboard</p></header><main id="homePage"><section class="dashboard"><div>💵 Cash<br><b id="cash">0 QAR</b></div><div class="green">🟢 Receive<br><b id="receive">0 QAR</b></div><div class="red">🔴 Pay<br><b id="pay">0 QAR</b></div><div>💳 Cards<br><b id="cards">0 QAR</b></div><div>💰 Savings<br><b id="savingsTotal">0 QAR</b></div><div>📈 Investments<br><b id="investmentTotal">0 QAR</b></div></section></main><section class="module" id="receiveSection"><h2>🟢 Money To Receive</h2><input id="receiveName" placeholder="Person"><input id="receiveAmount" type="number" placeholder="Amount QAR"><button onclick="addReceive()">Add Receive</button><div id="receiveList"></div></section><section class="module" id="expenses"><h2>🔴 Money To Pay</h2><input id="payName" placeholder="Person / Company"><input id="payAmount" type="number" placeholder="Amount QAR"><button onclick="addPay()">Add Payment</button><div id="payList"></div></section><section class="module" id="history"><h2>🧾 History</h2><div id="historyList"></div></section><section class="module" id="cardsSection"><h2>💳 Credit Cards</h2><input id="cardName" placeholder="Card Name"><input id="cardOutstanding" type="number" placeholder="Outstanding"><button onclick="addCard()">Add Card</button><div id="cardList"></div></section><section class="module" id="savings"><h2>💰 Savings</h2><input id="savingName" placeholder="Goal"><input id="savingTarget" type="number"><input id="savingAmount" type="number"><button onclick="addSaving()">Add Saving</button><div id="savingList"></div></section><section class="module" id="investments"><h2>📈 Investments</h2><input id="investmentName" placeholder="Investment"><input id="investmentValue" type="number"><button onclick="addInvestment()">Add Investment</button><div id="investmentList"></div></section><nav><button onclick="showPage('homePage')">🏠 Home</button><button onclick="showPage('receiveSection')">🟢 Receive</button><button onclick="showPage('expenses')">🔴 Pay</button><button onclick="showPage('cardsSection')">💳 Cards</button><button onclick="showPage('savings')">💰 Savings</button><button onclick="showPage('investments')">📈 Invest</button></nav></div><script>function showPage(id){document.querySelectorAll('.module,main').forEach(x=>x.style.display='none');document.getElementById(id).style.display='block';window.scrollTo(0,0);}</script><script src="app.js?v=10"></script></body></html>
