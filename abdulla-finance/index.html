<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Abdulla Finance</title><link rel="stylesheet" href="style.css"></head><body><div class="app"><header><h1>💰 Abdulla Finance</h1><p>Personal Finance Dashboard</p></header><section class="dashboard"><div>💵 Cash<br><b id="cash">0 QAR</b></div><div class="green">🟢 Receive<br><b id="receive">0 QAR</b></div><div class="red">🔴 Pay<br><b id="pay">0 QAR</b></div><div>💳 Cards<br><b id="cards">0 QAR</b></div></section><section class="module"><h2>📊 Financial Summary</h2><p id="summary">Loading...</p></section><section class="module"><h2>📈 Reports</h2><p>Receive: <b id="reportReceive">0 QAR</b></p><p>Pay: <b id="reportPay">0 QAR</b></p><p>Cards: <b id="reportCards">0 QAR</b></p></section><section class="module"><h2>🟢 Money To Receive</h2><input id="receiveName" placeholder="Person name"><input id="receiveAmount" type="number" placeholder="Amount QAR"><button onclick="addReceive()">Add Receive</button><div id="receiveList"></div></section><section class="module"><h2>🔴 Money To Pay</h2><input id="payName" placeholder="Person / Company"><input id="payAmount" type="number" placeholder="Amount QAR"><button onclick="addPay()">Add Payment</button><div id="payList"></div></section><section class="module"><h2>💳 Credit Cards</h2><input id="cardName" placeholder="Card Name"><input id="cardLimit" type="number" placeholder="Credit Limit"><input id="cardOutstanding" type="number" placeholder="Outstanding"><input id="cardDue" type="date"><button onclick="addCard()">Add Card</button><div id="cardList"></div></section><nav><button>🏠 Home</button><button>💸 Expenses</button><button>💰 Credit</button><button>💳 Cards</button><button>⚙️ Settings</button></nav></div><script src="app.js"></script></body></html>
