<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Abdulla Finance</title><link rel="stylesheet" href="style.css"></head><body><div class="app"><header><h1>💰 Abdulla Finance</h1></header><main id="homePage"><section class="dashboard"><div>💵 Cash<br><b id="cash">0 QAR</b></div><div class="green">🟢 Receive<br><b id="receive">0 QAR</b></div><div class="red">🔴 Pay<br><b id="pay">0 QAR</b></div><div>💳 Cards<br><b id="cards">0 QAR</b></div><div>💰 Savings<br><b id="savingsTotal">0 QAR</b></div><div>📈 Investments<br><b id="investmentTotal">0 QAR</b></div></section><h2>Choose Section</h2><button onclick="openBox('receiveSection')">🟢 Money To Receive</button><button onclick="openBox('expenses')">🔴 Money To Pay</button><button onclick="openBox('cardsSection')">💳 Credit Cards</button><button onclick="openBox('savings')">💰 Savings</button><button onclick="openBox('investments')">📈 Investments</button><button onclick="openBox('history')">🧾 History</button></main><section class="module" id="receiveSection"><h2>🟢 Receive</h2><input id="receiveName" placeholder="Person"><input id="receiveAmount" type="number" placeholder="Amount"><button onclick="addReceive()">Add</button><div id="receiveList"></div></section><section class="module" id="expenses"><h2>🔴 Pay</h2><input id="payName"><input id="payAmount" type="number"><button onclick="addPay()">Add</button><div id="payList"></div></section><section class="module" id="cardsSection"><h2>💳 Cards</h2><input id="cardName"><input id="cardOutstanding" type="number"><button onclick="addCard()">Add</button><div id="cardList"></div></section><section class="module" id="savings"><h2>💰 Savings</h2><input id="savingName"><input id="savingTarget" type="number"><input id="savingAmount" type="number"><button onclick="addSaving()">Add</button><div id="savingList"></div></section><section class="module" id="investments"><h2>📈 Investments</h2><input id="investmentName"><input id="investmentValue" type="number"><button onclick="addInvestment()">Add</button><div id="investmentList"></div></section><section class="module" id="history"><h2>🧾 History</h2><div id="historyList"></div></section></div><script>function openBox(id){document.querySelectorAll('main,.module').forEach(x=>x.style.display='none');document.getElementById(id).style.display='block';window.scrollTo(0,0)}</script><script src="app.js?v=11"></script></body></html>
