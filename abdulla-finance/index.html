<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Abdulla Finance</title><link rel="manifest" href="manifest.json"><link rel="stylesheet" href="style.css"></head><body><div class="app" id="app"><header><h1>💰 Abdulla Finance</h1><p>Personal Finance Dashboard</p></header><main id="homePage"><section class="dashboard"><div>💵 Cash<br><b id="cash">0 QAR</b></div><div class="green">🟢 Receive<br><b id="receive">0 QAR</b></div><div class="red">🔴 Pay<br><b id="pay">0 QAR</b></div><div>💳 Cards<br><b id="cards">0 QAR</b></div></section></main><section class="module" id="history"><h2>🧾 History</h2><div id="historyList"></div></section><section class="module" id="expenses"><h2>🔴 Money To Pay</h2><input id="payName" placeholder="Person / Company"><input id="payAmount" type="number" placeholder="Amount QAR"><button onclick="addPay()">Add Payment</button><div id="payList"></div></section><section class="module" id="cardsSection"><h2>💳 Credit Cards</h2><input id="cardName" placeholder="Card Name"><input id="cardLimit" type="number" placeholder="Credit Limit"><input id="cardOutstanding" type="number" placeholder="Outstanding"><input id="cardDue" type="date"><button onclick="addCard()">Add Card</button><div id="cardList"></div></section><section class="module" id="settings"><h2>⚙️ Settings</h2><button onclick="setPin()">Set PIN</button></section><nav><button onclick="showPage('homePage')">🏠 Home</button><button onclick="showPage('expenses')">💸 Pay</button><button onclick="showPage('history')">🧾 History</button><button onclick="showPage('cardsSection')">💳 Cards</button><button onclick="showPage('settings')">⚙️ Settings</button></nav></div><script>function showPage(id){document.querySelectorAll('.module,main').forEach(x=>x.style.display='none');document.getElementById(id).style.display='block';window.scrollTo(0,0);}</script><script src="app.js"></script></body></html>
