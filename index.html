<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Kerala Vacation Tracker 2026</title>
<link rel="stylesheet" href="style.css?v=2">
</head>
<body>
<div class="app">
<header>
<h1>🌴 Kerala Vacation 2026</h1>
<p>17 September → 20 October 2026</p>
<p id="tripDay">Day 1 / 34</p>
</header>
<main>
<section id="home" class="tab active"><div class="dashboard"><div class="box"><h3>💰 Available</h3><h2 id="moneyAvailable">₹0</h2></div><div class="box"><h3>💸 Spent</h3><h2 id="totalSpent">₹0</h2></div><div class="box"><h3>💳 Remaining</h3><h2 id="remainingMoney">₹0</h2></div><div class="box"><h3>📜 Transactions</h3><h2 id="transactionCount">0</h2></div></div></section>
<section id="add" class="tab"><div class="card"><h2>💰 Add Money</h2><input id="moneyAmount" type="number" placeholder="Amount ₹"><select id="moneySource"><option>My Savings</option><option>Borrowed</option><option>Family Support</option><option>Gift</option><option>Other</option></select><input id="moneyNote" placeholder="Note"><button onclick="addMoney()">Add Money</button></div><div class="card"><h2>💸 Add Expense</h2><input id="amount" type="number" placeholder="Amount ₹"><select id="category"><option>🍽 Food</option><option>🚕 Travel</option><option>🛍 Shopping</option><option>🎁 Gifts</option><option>🏠 Family</option><option>💊 Medical</option><option>📦 Other</option></select><select id="payment"><option>Cash</option><option>Card</option><option>UPI</option><option>Bank</option></select><input id="note" placeholder="Description"><button onclick="addExpense()">Add Expense</button></div></section>
<section id="historyTab" class="tab"><div class="card"><h2>📜 History</h2><div id="history"></div></div></section>
<section id="reports" class="tab"><div class="card"><h2>📊 Vacation Report</h2><p>Track your spending during Kerala vacation.</p></div></section>
<section id="settings" class="tab"><div class="card"><h2>⚙️ Settings</h2><button onclick="exportData()">Export Backup</button><input type="file" onchange="importData(event)"><button onclick="clearData()" class="danger">Delete All</button></div></section>
</main>
<nav class="bottom-nav"><button onclick="showTab('home')">🏠<span>Home</span></button><button onclick="showTab('add')">➕<span>Add</span></button><button onclick="showTab('historyTab')">📜<span>History</span></button><button onclick="showTab('reports')">📊<span>Reports</span></button><button onclick="showTab('settings')">⚙️<span>Settings</span></button></nav>
</div>
<script>function showTab(id){document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));document.getElementById(id).classList.add('active');}</script>
<script src="app.js?v=2"></script>
</body>
</html>
