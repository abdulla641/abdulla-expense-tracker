<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Kerala Vacation Tracker 2026</title>

<link rel="stylesheet" href="style.css">

</head>


<body>


<div class="app">


<header>

<h1>🌴 Kerala Vacation 2026</h1>

<p>17 September → 20 October 2026</p>

<p id="tripDay">
Day 1 / 34
</p>

</header>





<section class="dashboard">


<div class="box">

<h3>💰 Available</h3>

<h2 id="moneyAvailable">
₹0
</h2>

</div>



<div class="box">

<h3>💸 Spent</h3>

<h2 id="totalSpent">
₹0
</h2>

</div>



<div class="box">

<h3>💳 Remaining</h3>

<h2 id="remainingMoney">
₹0
</h2>

</div>



<div class="box">

<h3>📜 Transactions</h3>

<h2 id="transactionCount">
0
</h2>

</div>



</section>







<!-- Add Money -->


<section class="card">


<h2>💰 Add Money</h2>


<input
id="moneyAmount"
type="number"
placeholder="Amount ₹">



<select id="moneySource">


<option>My Savings</option>

<option>Borrowed</option>

<option>Family Support</option>

<option>Gift</option>

<option>Other</option>


</select>




<input

id="moneyNote"

placeholder="Note">


<button onclick="addMoney()">

Add Money

</button>


</section>









<!-- Add Expense -->


<section class="card">


<h2>💸 Add Expense</h2>



<input

id="amount"

type="number"

placeholder="Amount ₹">





<select id="category">


<option>🍽 Food</option>

<option>🚕 Travel</option>

<option>🛍 Shopping</option>

<option>🎁 Gifts</option>

<option>🏠 Family</option>

<option>💊 Medical</option>

<option>📦 Other</option>


</select>





<select id="payment">


<option>Cash</option>

<option>Card</option>

<option>UPI</option>

<option>Bank</option>


</select>





<input

id="note"

placeholder="Description">





<button onclick="addExpense()">


Add Expense


</button>



</section>







<!-- History -->


<section class="card">


<h2>
📜 Transactions
</h2>


<div id="history">

</div>


</section>








<!-- Backup -->


<section class="card">


<h2>
💾 Backup
</h2>


<button onclick="exportData()">

Export Backup

</button>



<input

type="file"

onchange="importData(event)">


<button

onclick="clearData()"

class="danger">


Delete All


</button>


</section>





</div>



<script src="app.js"></script>


</body>

</html>
