<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><link rel="manifest" href="manifest.json"><title>ITDesk — IT Infrastructure Manager</title><link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app-shell">
<aside class="sidebar"><div class="brand"><div class="logo">IT</div><div><strong>ITDesk</strong><small>Infrastructure Manager</small></div></div><nav id="nav"><button class="active" data-page="dashboard">⌂ Dashboard</button><button data-page="assets">▣ Assets</button><button data-page="network">⌁ Network</button><button data-page="maintenance">✓ Maintenance</button><button data-page="licenses">◷ Licenses & Contracts</button><button data-page="incidents">⚠ Incidents</button></nav><div class="sidebar-foot">V2 • Cloud workspace<br><span id="syncStatus">Sign in required</span></div></aside>
<main><header><div><button class="mobile-menu" id="menu">☰</button><span class="eyebrow">IT OPERATIONS</span><h1 id="pageTitle">Dashboard</h1></div><div class="header-actions"><span id="userStatus" class="sync-badge">Signed out</span><span id="userEmail" class="user-email"></span><button class="ghost" id="signOut">Sign out</button><button class="primary" id="quickAdd">＋ Add asset</button></div></header><section id="content"></section></main>
</div>
<div class="modal hidden" id="modal"><div class="modal-card"><div class="modal-head"><h2>Add asset</h2><button id="closeModal">×</button></div><form id="assetForm"><div class="grid"><label>Asset name<input required name="name" placeholder="Core Switch 01"></label><label>Type<select name="type"><option>Server</option><option>Firewall</option><option>Switch</option><option>Access Point</option><option>Printer</option><option>CCTV/NVR</option><option>Computer</option><option>Other</option></select></label><label>Brand / model<input name="model" placeholder="HPE Aruba 6200F"></label><label>Asset ID<input name="assetId" placeholder="IT-001"></label><label>Serial number<input name="serial" placeholder="Serial number"></label><label>IP address<input name="ip" placeholder="192.168.1.10"></label><label>Location<input name="location" placeholder="Server Room"></label><label>Warranty expiry<input type="date" name="warranty"></label></div><label>Notes<textarea name="notes" placeholder="Important configuration or maintenance notes"></textarea></label><div class="form-actions"><button type="button" class="ghost" id="cancelModal">Cancel</button><button class="primary">Save asset</button></div></form></div></div>
<div class="auth-screen hidden" id="authScreen"><div class="auth-card"><div class="auth-brand"><div class="logo">IT</div><div><strong>ITDesk</strong><small>Cloud workspace</small></div></div><h2 id="authTitle">Sign in to ITDesk</h2><p id="authHint">Your PC and iPhone will use the same cloud workspace.</p><form id="authForm"><label>Email<input required type="email" id="authEmail" placeholder="you@example.com" autocomplete="email"></label><label>Password<input required type="password" id="authPassword" placeholder="Minimum 6 characters" autocomplete="current-password"></label><button class="primary auth-submit" id="authSubmit">Sign in</button></form><button class="auth-switch" id="authSwitch">New here? Create an account</button><div id="authMessage" class="auth-message"></div></div></div>
<script src="supabase-config.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="app.js"></script>
</body></html>
